name: Release Kensidian

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install frontend dependencies
        run: bun install

      - name: Extract Changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Ekstrak bagian changelog untuk versi saat ini
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \\[/ && flag { flag=0; exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          # Fallback jika kosong
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Pembaruan Kensidian versi $VERSION" > RELEASE_NOTES.md
          fi

      - name: Build & Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Kensidian v__VERSION__"
          releaseBodyFile: RELEASE_NOTES.md
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
