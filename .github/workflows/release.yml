name: Release Kensidian

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
            rust_targets: ""
          - platform: "ubuntu-22.04"
            args: ""
            rust_targets: ""
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential libxdo-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Extract Changelog
        id: changelog
        run: |
          bun -e '
          import fs from "node:fs";
          import crypto from "node:crypto";
          const tag = process.env.GITHUB_REF_NAME || "";
          const version = tag.replace(/^v/, "");
          const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
          const headerRe = new RegExp("^## \\[" + version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\]");
          let capture = false;
          const result = [];
          for (const line of lines) {
            if (headerRe.test(line)) { capture = true; continue; }
            if (capture && /^## \[/.test(line)) break;
            if (capture) result.push(line);
          }
          const notes = result.join("\n").trim() || `Pembaruan Kensidian versi ${version}`;
          const delim = "EOF_" + crypto.randomUUID().replace(/-/g, "");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes<<${delim}\n${notes}\n${delim}\n`, "utf8");
          '

      - name: Build & Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Kensidian v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
