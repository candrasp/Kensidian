name: Release Kensidian

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install frontend dependencies
        run: bun install

      - name: Extract Changelog
        id: changelog
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $capture = $false
          $result = @()

          foreach ($line in $lines) {
            if ($line -match "^## \[$([regex]::Escape($version))\]") {
              $capture = $true
              continue
            }
            if ($capture -and $line -match '^## \[') {
              break
            }
            if ($capture) {
              $result += $line
            }
          }

          if ($result.Count -eq 0) {
            $result = @("Pembaruan Kensidian versi $version")
          }

          $content = ($result -join "`n").Trim()
          $delimiter = "EOF_" + [guid]::NewGuid().ToString("N")
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$delimiter" -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value $content -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter -Encoding UTF8

      - name: Build & Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Kensidian v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
